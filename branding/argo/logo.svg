<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Argo Linux</title>
  <!-- The Argo, Jason's ship: a Greek galley with a square sail, oars, the
       ram at the bow and the stern curling up. Argo Linux's logo. -->
  <defs>
    <style>
      .hull { fill: #1d3f6e; }
      .sail { fill: #f2b544; }
      .sail-band { fill: #d9822b; }
      .line { stroke: #1d3f6e; stroke-width: 4; stroke-linecap: round; fill: none; }
      .oar { stroke: #1d3f6e; stroke-width: 3.5; stroke-linecap: round; }
      .sea { stroke: #2e86c1; stroke-width: 6; stroke-linecap: round; fill: none; }
      .eye { fill: #f2b544; }
    </style>
  </defs>

  <!-- mast and yard -->
  <path class="line" d="M128 150 V52" />
  <path class="line" d="M84 62 H172" />
  <!-- the square sail, filled by the wind -->
  <path class="sail" d="M88 64 H168 C172 92 172 116 166 138 H90 C84 116 84 92 88 64 Z" />
  <path class="sail-band" d="M86.5 92 H169.5 C170 98 170 104 169.6 110 H86.4 C86 104 86 98 86.5 92 Z" />

  <!-- oars, dipping into the sea -->
  <g class="oar">
    <path d="M70 168 L56 196" />
    <path d="M94 170 L80 198" />
    <path d="M118 171 L104 199" />
    <path d="M142 171 L128 199" />
    <path d="M166 170 L152 198" />
  </g>

  <!-- the hull: stern curling up on the left, the ram and the bow post on the right -->
  <path class="hull" d="
    M40 150
    L198 150
    C206 150 210 140 211 126
    C212 116 220 112 226 118
    C222 120 219 126 219 134
    L216 158
    L236 166
    L232 172
    L208 174
    C170 186 92 186 62 176
    C44 170 32 154 30 132
    C28 112 40 96 56 98
    C66 100 68 112 60 116
    C54 118 50 112 54 108
    C46 108 42 118 42 128
    C42 138 42 146 40 150 Z" />
  <!-- the eye painted on the bow -->
  <circle class="eye" cx="200" cy="162" r="4" />

  <!-- the sea -->
  <path class="sea" d="M20 212 C40 202 60 202 80 212 S120 222 140 212 S180 202 200 212 S230 220 240 214" />
  <path class="sea" d="M44 232 C60 224 76 224 92 232 S124 240 140 232 S172 224 188 232" opacity="0.6" />
</svg>
