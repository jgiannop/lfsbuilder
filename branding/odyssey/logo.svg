<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Odyssey Linux</title>
  <!-- Odysseus's ship sailing home: one square sail with a red band, the bow and stern
       curving up, the sun setting on the horizon behind it. Odyssey Linux's logo (for light backgrounds). -->
  <defs>
    <clipPath id="above-sea"><rect x="0" y="0" width="256" height="176" /></clipPath>
    <clipPath id="sail-shape"><path d="M94 68 H162 C168 92 168 118 160 140 H96 C88 118 88 92 94 68 Z" /></clipPath>
  </defs>

  <!-- the setting sun, cut by the horizon -->
  <circle cx="128" cy="168" r="80" fill="#f2a65a" clip-path="url(#above-sea)" />

  <!-- mast and yard -->
  <path d="M128 172 V56" stroke="#1d3f6e" stroke-width="5" stroke-linecap="round" fill="none" />
  <path d="M88 66 H168" stroke="#1d3f6e" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- the sail, filled by the wind, and its band -->
  <path d="M94 68 H162 C168 92 168 118 160 140 H96 C88 118 88 92 94 68 Z" fill="#ffffff" stroke="#1d3f6e" stroke-width="3" stroke-linejoin="round" />
  <rect x="80" y="97" width="100" height="15" fill="#c0392b" clip-path="url(#sail-shape)" />

  <!-- the hull: the stern curling up on the left, the high bow on the right -->
  <path fill="#1d3f6e" d="
    M58 168 H200
    C206 168 212 160 214 148
    C216 140 222 137 227 141
    C221 146 219 156 215 170
    C205 188 176 195 128 195
    C84 195 60 189 50 177
    C44 170 42 160 44 150
    C46 142 52 139 57 143
    C52 150 52 160 58 168 Z" />

  <!-- the sea -->
  <path d="M24 210 C44 202 64 202 84 210 S124 218 144 210 S184 202 204 210 S228 216 236 212"
        stroke="#2e86c1" stroke-width="6" stroke-linecap="round" fill="none" />
  <path d="M52 230 C68 222 84 222 100 230 S132 238 148 230 S180 222 196 230"
        stroke="#2e86c1" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6" />
</svg>
