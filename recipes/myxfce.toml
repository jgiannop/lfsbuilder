# A recipe: everything that makes this system this system (written by lfsbuilder).

[distribution]
name = "Odyssey Linux"
version = "0.1"

[base]
init = "systemd"
stage3 = "20261115T170104Z"
repository = "e19f4a84f0138c2703c3d36e5e6b0f58e6fd4aeb"
profile = "default/linux/amd64/23.0/desktop/systemd"
cpu = "x86-64"
cflags = "-O2 -pipe"
binary_packages = true
kernel = "gentoo-kernel-bin"
jobs = 0

[use]
global = []

[use.packages]
"dev-libs/libdbusmenu" = ["gtk3"]
"media-libs/libvpx" = ["postproc"]

[packages]
install = ["x11-base/xorg-server", "xfce-base/xfce4-meta", "x11-misc/lightdm", "x11-misc/lightdm-gtk-greeter", "www-client/firefox", "app-editors/nano"]

[system]
hostname = "myxfce"
domain = "localdomain"
locale = "en_US.UTF-8"
timezone = "Europe/Athens"
keymap = "us"

[network]
manager = "networkmanager"
mode = "dhcp"

[services]
enable = ["lightdm"]

[users]
root_password = ""
sudo = true

[[users.accounts]]
name = "demo"
full_name = "Demo User"
groups = ["wheel", "audio", "video", "users"]
password = "$6$woOKfvYyg2qIitmP$uwQTom.5BvfCc80CZEQjS6ju6fOVms4TIY7fDqwNuLmUaCL81QIy8pimI6SZ10XYd6kghXygCXG4yeCkIWLPz."

[updates]
server = "http://192.168.1.93:8080/"
key = "keys/binhost.asc"

[installer]
graphical = true

[output]
format = "qemu"
size_gb = 30
filesystem = "ext4"
